<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第41回鹿児島県マスターズ エントリー検索</title>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#00c4ff;--accent2:#0077cc;--male:#1565c0;--female:#b71c6e;--mixed:#6a3fb5;--text:#e8f0fe;--text2:#8ca0c0;--border:#1e3050;--card-bg:#13203a;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;max-width:440px;margin:0 auto;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
#overlay-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:360px;width:100%;}
#overlay-box h2{font-size:16px;color:var(--accent);margin-bottom:16px;text-align:center;}
#overlay-box ol{padding-left:20px;font-size:14px;line-height:2;color:var(--text);}
#overlay-box .note{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.7;}
#overlay-box .store-btn{display:block;margin-top:14px;padding:10px;background:linear-gradient(135deg,#007aff,#005ec4);border-radius:10px;color:#fff;text-align:center;text-decoration:none;font-size:14px;font-weight:700;}
#overlay-box .close-btn{width:100%;margin-top:14px;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.header{background:linear-gradient(135deg,#0a1628,#0d1f3c);border-bottom:1px solid var(--border);padding:16px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.5);}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.header-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.3;}
.header-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.tabs{display:flex;margin-bottom:14px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.tab{flex:1;padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;background:var(--surface2);-webkit-tap-highlight-color:transparent;}
.tab.active{background:linear-gradient(135deg,var(--accent2),#005fa3);color:#fff;}
.gender-filter{display:flex;gap:6px;margin-bottom:12px;}
.gchip{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:700;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.gchip.active-all{background:var(--accent2);border-color:var(--accent);color:#fff;}
.gchip.active-male{background:var(--male);border-color:var(--male);color:#fff;}
.gchip.active-female{background:var(--female);border-color:var(--female);color:#fff;}
.gchip.active-mixed{background:var(--mixed);border-color:var(--mixed);color:#fff;}
.search-wrap{display:flex;gap:8px;margin-bottom:10px;}
.search-input{flex:1;padding:12px 16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:16px;font-family:inherit;outline:none;min-width:0;}
.search-input::placeholder{color:var(--text2);}
.search-input:focus{border-color:var(--accent);}
.search-btn{padding:12px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.chips-scroll{overflow-x:auto;white-space:nowrap;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips-scroll::-webkit-scrollbar{display:none;}
.chip{display:inline-block;padding:5px 12px;margin-right:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;}
.chip.active{background:var(--accent2);border-color:var(--accent);color:#fff;}
.program-select-wrap{margin-bottom:14px;}
.program-select{width:100%;padding:12px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;font-family:inherit;outline:none;appearance:none;-webkit-appearance:none;}
.program-select option{background:#1a2234;color:#e8f0fe;}
.program-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;}
.panel{display:none;}.panel.active{display:block;}
.main{padding:12px 12px 0;}
.status-bar{font-size:12px;color:var(--text2);padding:8px 4px;text-align:center;}
.status-bar span{color:var(--accent);font-weight:600;}
.swimmer-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.swimmer-card.open{border-color:var(--accent2);}
.card-header{padding:14px 14px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.swimmer-name{font-size:16px;font-weight:700;color:var(--text);flex:1;}
.swimmer-yomi{font-size:11px;color:var(--text2);opacity:.7;margin-top:1px;font-weight:400;}
.badge{font-size:11px;background:var(--accent2);color:#fff;border-radius:10px;padding:2px 9px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.swimmer-team{font-size:13px;color:var(--text2);}
.age-tag{font-size:11px;color:var(--text2);background:var(--surface2);border-radius:6px;padding:1px 7px;}
.cls-tag{font-size:11px;color:#ffd166;background:rgba(255,209,102,0.12);border-radius:6px;padding:1px 7px;font-weight:700;}
.gen-tag{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:700;color:#fff;}
.gen-tag.male{background:var(--male);}.gen-tag.female{background:var(--female);}.gen-tag.mixed{background:var(--mixed);}
.toggle-hint{margin-top:8px;font-size:11px;color:var(--accent);}
.details{display:none;border-top:1px solid var(--border);}
.swimmer-card.open .details{display:block;}
.detail-item{padding:10px 14px;border-bottom:1px solid rgba(30,48,80,0.6);font-size:13px;color:var(--text);line-height:1.5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.detail-item:last-child{border-bottom:none;}
.gender-block-title{font-size:14px;font-weight:700;padding:10px 4px 8px;border-bottom:2px solid;margin-bottom:10px;margin-top:16px;}
.gender-block-title.male{color:#5c9dff;border-color:var(--male);}
.gender-block-title.female{color:#ff6fae;border-color:var(--female);}
.gender-block-title.mixed{color:#b794f6;border-color:var(--mixed);}
.cls-title{font-size:12px;font-weight:700;color:#ffd166;padding:6px 4px 6px;margin-top:6px;}
.program-title{font-size:14px;font-weight:700;color:var(--accent);padding:10px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.entry-row{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;}
.entry-name{font-size:16px;font-weight:700;color:var(--text);}
.entry-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;align-items:center;}
.time-tag{font-size:12px;color:var(--accent);font-weight:600;background:rgba(0,196,255,0.1);border-radius:6px;padding:1px 8px;}
.relay-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;}
.relay-team{font-size:15px;font-weight:700;color:var(--text);}
.relay-sel{display:flex;gap:6px;margin-bottom:12px;}
.relay-note{font-size:11px;color:var(--text2);text-align:center;margin:4px 0 10px;}
.no-result{text-align:center;padding:60px 20px;color:var(--text2);}
.no-result .emoji{font-size:40px;margin-bottom:12px;}
.initial-state{text-align:center;padding:40px 20px;color:var(--text2);}
.initial-state .emoji{font-size:48px;margin-bottom:16px;}
.initial-state h3{font-size:16px;color:var(--text);margin-bottom:8px;}
.initial-state p{font-size:13px;line-height:1.7;}
.stats-row{display:flex;justify-content:center;gap:20px;margin-top:20px;}
.stat-item{text-align:center;}
.stat-num{font-size:22px;font-weight:700;color:var(--accent);}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px;}
.foot{font-size:10px;color:var(--text2);text-align:center;margin-top:24px;line-height:1.6;opacity:.8;}

/* Keep controls readable and operable on narrow screens and with a keyboard. */
button{font-family:inherit;}
button:focus-visible,select:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.tab{border:0;min-height:44px;font-size:14px;}
.gchip{min-height:44px;font-size:14px;}
.chip{min-height:44px;font-family:inherit;font-size:14px;}
.header-sub,.swimmer-yomi,.badge,.age-tag,.cls-tag,.gen-tag,.toggle-hint,.cls-title,.time-tag,.relay-note,.stat-label{font-size:14px;}
.status-bar,.initial-state p,.swimmer-team,.detail-item{font-size:14px;}
.swimmer-yomi{opacity:1;display:block;}
.card-header{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit;}
.swimmer-name,.toggle-hint{display:block;}
.swimmer-name,.entry-name,.relay-team,.detail-item{overflow-wrap:anywhere;}
.program-select{appearance:auto;-webkit-appearance:menulist;}
.stats-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.stat-label{line-height:1.5;}
.foot{font-size:13px;padding:0 12px;opacity:1;}
.foot a{color:var(--accent);text-underline-offset:3px;}
@media(max-width:360px){.stats-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}.tab{font-size:12px;white-space:nowrap;}.header{padding:12px 12px 0;}.header-sub{font-size:12px;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-icon">🏊</div>
    <div>
      <div class="header-title">第41回 鹿児島県マスターズ<br>スイミングフェスティバル</div>
      <div class="header-sub">2026.12.6（日）鴨池公園水泳プール（25m）</div>
    </div>
  </div>
  <div class="tabs">
    <button type="button" class="tab active" aria-pressed="true" onclick="switchTab(1)">🔍 選手・チーム</button>
    <button type="button" class="tab" aria-pressed="false" onclick="switchTab(2)">📋 種目検索</button>
    <button type="button" class="tab" aria-pressed="false" onclick="switchTab(3)">🔄 リレー</button>
  </div>
</div>

<div class="main">
  <div class="panel active" id="panel1">
    <div class="gender-filter" id="gf1">
      <button type="button" class="gchip active-all" aria-pressed="true" onclick="setGender(1,'all',this)">全員</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(1,'male',this)">🔵 男子</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(1,'female',this)">🔴 女子</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" aria-label="選手名・読み仮名・チーム名で検索" enterkeyhint="search" placeholder="名前・ﾖﾐ・チーム名…" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="search-btn" onclick="doSearch()">検索</button>
    </div>
    <div class="chips-scroll" id="chipsArea"></div>
    <div id="statusBar1" class="status-bar" role="status" aria-live="polite" aria-atomic="true" style="display:none"></div>
    <div id="result1">
      <div class="initial-state">
        <div class="emoji">🔍</div>
        <h3>選手・チームを検索</h3>
        <p>名前（苗字のみ・カナでも可）または<br>チーム名を入力してください</p>
        <div class="stats-row">
          <div class="stat-item"><div class="stat-num" id="totalCount">-</div><div class="stat-label">個人エントリー</div></div>
          <div class="stat-item"><div class="stat-num" id="swimmerCount">-</div><div class="stat-label">参加選手</div></div>
          <div class="stat-item"><div class="stat-num" id="teamCount">-</div><div class="stat-label">参加チーム</div></div>
          <div class="stat-item"><div class="stat-num" id="relayCount">-</div><div class="stat-label">リレー</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel2">
    <div class="gender-filter" id="gf2">
      <button type="button" class="gchip active-all" aria-pressed="true" onclick="setGender(2,'all',this)">全員（男女分割）</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(2,'male',this)">🔵 男子</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(2,'female',this)">🔴 女子</button>
    </div>
    <div class="program-select-wrap">
      <select class="program-select" id="programSelect" aria-label="個人種目を選択" onchange="searchByProgram()"><option value="">── 種目を選んでください ──</option></select>
      <button class="program-btn" onclick="searchByProgram()">この種目の出場選手を表示</button>
    </div>
    <div id="statusBar2" class="status-bar" role="status" aria-live="polite" aria-atomic="true" style="display:none"></div>
    <div id="result2">
      <div class="initial-state"><div class="emoji">📋</div><h3>種目から選手を検索</h3><p>種目を選ぶと、男女別・年齢区分別に<br>エントリータイム順で表示します</p></div>
    </div>
  </div>

  <div class="panel" id="panel3">
    <div class="gender-filter" id="gf3">
      <button type="button" class="gchip active-all" aria-pressed="true" onclick="setGender(3,'all',this)">全て</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(3,'male',this)">🔵 男子</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(3,'female',this)">🔴 女子</button>
      <button type="button" class="gchip" aria-pressed="false" onclick="setGender(3,'mixed',this)">🟣 混合</button>
    </div>
    <div class="relay-note">※エントリー表にはチームのみ掲載（泳者は当日オーダー）</div>
    <div id="statusBar3" class="status-bar" role="status" aria-live="polite" aria-atomic="true" style="display:none"></div>
    <div id="result3"></div>
  </div>
</div>
<p class="foot">年齢区分は公式エントリー一覧の掲載値を表示しています。<br><a href="https://www.kagoshima-swim.com/new/wp-content/uploads/2026/10/b8cdbbeb4e34e1c1102a036c7fd77a35.pdf" target="_blank" rel="noopener noreferrer">公式エントリー一覧（11月14日訂正版・PDF）</a></p>

  const aliases=[team];
  teamAliases.forEach((readings,base)=>{
    // A/B/C relay squads share the individual team's reading.
    if(team===base||(team.startsWith(base)&&/^[a-z]$/.test(team.slice(base.length)))){
      aliases.push(...readings);
    }
  });
  return aliases.join('\n');
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function kata(s){return s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));}
function normalize(s){return s?kata(s.normalize('NFKC')).replace(/[\s　]+/g,'').toLowerCase():'';}
function isFemale(s){return s.gen==='女';}
function isMale(s){return s.gen==='男';}
function secs(t){
  const value=String(t??'').normalize('NFKC').trim();
  if(!/^\d+(?::[0-5]\d)?(?:\.\d+)?$/.test(value))return Infinity;
  const p=value.split(':');
  const n=p.length>1?Number(p[0])*60+Number(p[1]):Number(p[0]);
  return Number.isFinite(n)?n:Infinity;
}
const GEN={m:['male','男子'],f:['female','女子'],x:['mixed','混合']};

function genTag(s){return isFemale(s)?'<span class="gen-tag female">女子</span>':isMale(s)?'<span class="gen-tag male">男子</span>':'<span class="gen-tag mixed">性別不明</span>';}

function relayCardHTML(r){
  const [cls,lab]=GEN[r[4]];
  return `<div class="relay-card"><div class="relay-team">${esc(r[1])}<span class="age-tag" style="margin-left:8px;font-weight:400">No.${esc(r[0])}</span></div><div class="entry-meta"><span class="gen-tag ${cls}">${lab}</span><span class="swimmer-team">${esc(r[3])}m ${esc(r[2])}</span><span class="cls-tag">${esc(r[5])}</span><span class="time-tag">${esc(r[6])}</span></div></div>`;
}

function doSearch(kw){
  const input=document.getElementById('searchInput');
  const raw=typeof kw==='string'?kw:input.value;
  const keyword=normalize(raw);
  const container=document.getElementById('result1');
  const statusBar=document.getElementById('statusBar1');
  const gen=genderState[1];
  if(!keyword){container.innerHTML=initialSearchHTML;statusBar.textContent='';statusBar.style.display='none';return;}
  let results=sw.filter(s=>s.key.includes(keyword));
  if(gen==='male')results=results.filter(isMale);
  if(gen==='female')results=results.filter(isFemale);
  let relays=RELAY.filter((r,i)=>RELAY_KEY[i].includes(keyword));
  if(gen==='male')relays=relays.filter(r=>r[4]==='m'||r[4]==='x');
  if(gen==='female')relays=relays.filter(r=>r[4]==='f'||r[4]==='x');
  statusBar.style.display='block';
  statusBar.innerHTML=(results.length||relays.length)?`選手 <span>${results.length}</span>名`+(relays.length?`　リレー <span>${relays.length}</span>件`:''):'該当する選手が見つかりませんでした';
  if(!results.length&&!relays.length){container.innerHTML=`<div class="no-result"><div class="emoji">😓</div><p>「${esc(raw)}」に一致するエントリーがありません</p></div>`;return;}
  container.innerHTML='';
  results.forEach(s=>{
    const card=document.createElement('div');card.className='swimmer-card';
    const rows=s.ev.map(e=>`<div class="detail-item">${esc(e.di)}m ${esc(e.st)}<span class="cls-tag">${esc(e.cl)}</span><span class="time-tag">${esc(e.tm)}</span></div>`).join('');
    card.innerHTML=`<button type="button" class="card-header" aria-expanded="false" aria-controls="details-${s.no}" onclick="toggleCard(this)"><span class="card-top"><span class="swimmer-name">${esc(s.name)}<span class="swimmer-yomi">${esc(s.yomi)}</span></span><span class="badge">${s.ev.length?s.ev.length+'種目':'個人種目なし'}</span></span><span class="card-meta"><span class="swimmer-team">🏊 ${esc(s.sc)}</span><span class="age-tag">${esc(s.age)}歳${s.gr?' / '+esc(s.gr):''}</span>${genTag(s)}</span><span class="toggle-hint">▼ タップで出場種目を表示</span></button><div class="details" id="details-${s.no}">${rows||'<div class="detail-item">個人種目のエントリーはありません</div>'}</div>`;
    container.appendChild(card);
  });
  if(relays.length){
    const t=document.createElement('div');t.className='program-title';t.textContent='🔄 リレーエントリー';container.appendChild(t);
    relays.forEach(r=>container.insertAdjacentHTML('beforeend',relayCardHTML(r)));
  }
}

  let any=false;
  blocks.forEach(([cls,lab,list])=>{
    if(!list.length)return;any=true;
    const t=document.createElement('div');t.className='gender-block-title '+cls;t.textContent=`${lab} ${di}m ${st}`;container.appendChild(t);
    [...new Set(list.map(e=>e.cl))].sort((a,b)=>{const ai=CLS_ORDER.indexOf(a),bi=CLS_ORDER.indexOf(b);return (ai<0?CLS_ORDER.length:ai)-(bi<0?CLS_ORDER.length:bi);}).forEach(c=>{
      const g=list.filter(e=>e.cl===c).sort((a,b)=>secs(a.tm)-secs(b.tm));
      if(!g.length)return;
      const h=document.createElement('div');h.className='cls-title';h.textContent=`■ ${c||'区分未記入'}区分（${g.length}名）`;container.appendChild(h);
      g.forEach(s=>container.appendChild(makeEntryRow(s)));
    });
  });
  if(!any)container.innerHTML='<div class="no-result"><div class="emoji">😓</div><p>エントリーがありません</p></div>';
}
function makeEntryRow(s){
  const row=document.createElement('div');row.className='entry-row';
  row.innerHTML=`<div class="entry-name">${esc(s.name)}<div class="swimmer-yomi">${esc(s.yomi)}</div></div><div class="entry-meta"><span class="swimmer-team">🏊 ${esc(s.sc)}</span><span class="age-tag">${esc(s.age)}歳</span>${genTag(s)}<span class="time-tag">${esc(s.tm)}</span></div>`;
  return row;
}

function showRelay(){
  const container=document.getElementById('result3');
  const statusBar=document.getElementById('statusBar3');
  const gen=genderState[3];
  const gm={male:'m',female:'f',mixed:'x'};
  let list=RELAY.filter(r=>gen==='all'||r[4]===gm[gen]);
  statusBar.style.display='block';
  statusBar.innerHTML=`リレー <span>${list.length}</span>件がエントリー`;
  container.innerHTML='';
  const evs=['メドレーリレー','フリーリレー'];
  ['m','f','x'].forEach(g=>{
    evs.forEach(ev=>{
      const items=list.filter(r=>r[4]===g&&r[2]===ev);
      if(!items.length)return;
      const [cls,lab]=GEN[g];
      const t=document.createElement('div');t.className='gender-block-title '+cls;t.textContent=`${lab} 100m ${ev}（${items.length}）`;container.appendChild(t);
      const rank=c=>{const m=c.match(/\d+/);return c.includes('以下')?0:+m[0];};
      const groups={};items.forEach(r=>{(groups[r[5]]=groups[r[5]]||[]).push(r);});
      Object.keys(groups).sort((a,b)=>rank(a)-rank(b)).forEach(c=>{
        const h=document.createElement('div');h.className='cls-title';h.textContent=`■ ${c}`;container.appendChild(h);
        groups[c].sort((a,b)=>secs(a[6])-secs(b[6])).forEach(r=>container.insertAdjacentHTML('beforeend',relayCardHTML(r)));
      });
    });
  });
  if(!list.length)container.innerHTML='<div class="no-result"><div class="emoji">🔄</div><p>該当するリレーはありません</p></div>';
}

function toggleCard(el){
  const card=el.closest('.swimmer-card');card.classList.toggle('open');
  el.setAttribute('aria-expanded',String(card.classList.contains('open')));
  el.querySelector('.toggle-hint').textContent=card.classList.contains('open')?'▲ 閉じる':'▼ タップで出場種目を表示';
}
function quickSearch(team,chipEl){
  document.getElementById('searchInput').value=team;
  document.querySelectorAll('.chip').forEach(c=>{c.classList.remove('active');c.setAttribute('aria-pressed','false');});
  if(chipEl){chipEl.classList.add('active');chipEl.setAttribute('aria-pressed','true');}
  doSearch(team);
}
const searchInput=document.getElementById('searchInput');
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();doSearch();}});
searchInput.addEventListener('input',e=>{
  document.querySelectorAll('.chip').forEach(c=>{c.classList.remove('active');c.setAttribute('aria-pressed','false');});
  if(!e.isComposing)doSearch();
});
searchInput.addEventListener('compositionend',()=>doSearch());
</script>
</body>
